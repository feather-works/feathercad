[package]
name = "feathercad"
version = "0.1.0"
description = "FeatherCAD — CAD 2D da suíte FeatherOffice"
authors = ["FeatherCAD"]
edition = "2021"
rust-version = "1.77.2"

# Casca fina: janela, protocolo da ponte e (depois) diálogos e disco. Todo o
# motor do desenho está no `feathercad-core`, chamado pela `feathercad-ponte`.
[lib]
name = "feathercad_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Só para os comandos do Monitor (`memoria_arvore`, `metricas`) devolverem JSON.
serde = { version = "1", features = ["derive"] }
# Caminho, não workspace: o `target/` do Tauri não recompila por causa do motor.
feathercad-ponte = { path = "../crates/feathercad-ponte" }
feathercad-io = { path = "../crates/feathercad-io" }
# O mesmo motor de ferramentas do MCP, hospedado aqui para agir ao vivo no desenho da tela (`mcp_vivo.rs`).
feathercad-mcp = { path = "../crates/feathercad-mcp" }
serde_json = "1"

# A caixa de abrir/salvar pelo portal do sistema (xdg-desktop-portal) no Linux;
# nos outros sistemas, a caixa nativa (como no FeatherSheet).
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
# O mesmo WebKitGTK que o Tauri já usa: só para pedir aceleração por GPU (`HardwareAccelerationPolicy`).
webkit2gtk = { version = "2.0.2", features = ["v2_16"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = { version = "2" }

# O `app:dev` compila em debug, e o motor em debug é ~7x mais lento (medido em 30/09/2026 com
# `cargo run --example medir_movimento`, em crates/feathercad-ponte: 50 mil linhas = quadro de 25 ms
# em debug contra 3,4 ms em release; um quadro de tela tem 16,6 ms). Só o motor e o que ele usa
# ficam otimizados; o resto (a casca da janela) segue em debug e compila rápido.
[profile.dev.package.feathercad-core]
opt-level = 3
[profile.dev.package.feathercad-ponte]
opt-level = 3
[profile.dev.package.feathercad-mcp]
opt-level = 3
[profile.dev.package.feathercad-io]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.serde]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Sem `panic = "abort"`: um pânico numa ferramenta do MCP ao vivo é capturado (`rpc.rs`) em vez de derrubar o aplicativo.

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

# Provisório: até a tag v0.1.0 ser publicada em github.com/FeatherOffice/feather-draw,
# usa a cópia local do repositório ao lado do monorepo.
[patch."https://github.com/FeatherOffice/feather-draw"]
feather-draw = { path = "../../../feather-draw" }
