[package]
name = "feathercad-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Servidor MCP do FeatherCAD: deixa uma IA ver (imagem), medir e desenhar, tudo local (stdio)."

# Só Rust puro e nada de rede: o servidor fala com quem o abriu por stdin/stdout. Nenhum conteúdo
# do desenho sai da máquina (regra 5 da suíte). O motor é o mesmo do aplicativo.
[dependencies]
feathercad-core = { path = "../feathercad-core" }
feathercad-io = { path = "../feathercad-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A imagem que a IA "enxerga": rasterização e PNG em Rust puro.
tiny-skia = "0.11"
base64 = "0.22"
# Texto das legendas (coordenadas, ids). A fonte é lida do sistema; sem ela, as legendas usam um alfabeto de traços próprio.
ab_glyph = "0.2"

[[bin]]
name = "feathercad-mcp"
path = "src/main.rs"

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
