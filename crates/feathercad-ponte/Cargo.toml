[package]
name = "feathercad-ponte"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "A camada de comandos: o TypeScript pede, o motor no Rust responde."

# O JSON da ponte mora aqui (o `feathercad-core` não ganha dependência). Este
# crate também vira `.wasm` para os testes do TypeScript rodarem contra o
# motor de verdade, então não depende do `feathercad-io` (ler/gravar arquivo
# é do `src-tauri`, que entrega o documento pronto para cá).
[dependencies]
feathercad-core = { path = "../feathercad-core" }
# Visualização vetorial somente na ponte: precisão f64 permanece no motor CAD.
feather-draw = { git = "https://github.com/FeatherOffice/feather-draw", tag = "v0.1.1" }
# Ler/gravar DXF e .fcdz (só `zip` em Rust puro; compila também para o .wasm).
feathercad-io = { path = "../feathercad-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "feathercad_ponte"
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "s"

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

