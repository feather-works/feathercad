[package]
name = "feathercad-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "O motor do FeatherCAD: o desenho, a geometria, o cursor (snap/orto), a linha de comando e o desfazer."

# Sem dependência além do `serde`, de propósito: o motor compila em segundos e
# roda no app, no teste e em WebAssembly. Ler e gravar DXF/.fcdz é do
# `feathercad-io` (ainda não existe), e o JSON da ponte mora no `feathercad-ponte`.
[dependencies]
serde = { version = "1", features = ["derive"] }

[lib]
name = "feathercad_core"

# Ligados no primeiro commit (RECEITA.md §4). `#[allow]` para calar não passa:
# quebre a função.
[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
