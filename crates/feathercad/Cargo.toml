[package]
name = "feathercad"
version = "0.2.0"
edition = "2021"
rust-version = "1.77.2"
description = "FeatherCAD: CAD 2D em Rust (interface no pelicano)"

# A interface fala com o motor só pela `Ponte` (o mesmo contrato JSON que o TypeScript usava);
# o desenho vem do `quadro` binário (FCQ1), decodificado em `quadro.rs`.
[dependencies]
pelicano = "0.1.34"
feather-ui = { git = "https://github.com/feather-works/feather-ui.git", tag = "v0.3.16" }
feathercad-core = { path = "../feathercad-core" }
feathercad-io = { path = "../feathercad-io" }
feathercad-ponte = { path = "../feathercad-ponte" }
feathercad-mcp = { path = "../feathercad-mcp" }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# As imagens do desenho (raster por baixo dos traços).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"
